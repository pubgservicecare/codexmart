[package]
name = "codexmart"
description = "CODE X MART - Retail Point of Sale"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
default-run = "codexmart"

[lib]
name = "codexmart_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Test hooks for the automated end-to-end tests only: license state in one
# folder, a shifted clock, a simulated computer and an extra trusted key.
# The installer build never enables this (see e2e/run-all.mjs).
e2e = ["dep:hex"]

[dependencies]
codexmart-core = { path = "../crates/codexmart-core" }
codexmart-license = { path = "../crates/codexmart-license" }
hex = { version = "0.4", optional = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
chrono = "0.4"

[dev-dependencies]
codexmart-license = { path = "../crates/codexmart-license", features = ["issuer"] }
ed25519-dalek = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
] }
