[workspace]
resolver = "2"
members = ["src-tauri", "crates/codexmart-core", "crates/codexmart-license", "tools/license-generator/src-tauri"]

[workspace.package]
version = "1.1.0"
edition = "2021"
authors = ["CODE X MART"]
license = "UNLICENSED"

[profile.release]
codegen-units = 1
lto = true
strip = true

# Key derivation is deliberately slow; keep it fast enough in debug builds
# (tests and the end-to-end License Generator) by optimising these crates.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
